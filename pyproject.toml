[project]
name = "treasury-agent"
version = "0.1.0"
description = "Adaptive Treasury Controller (Kit 1) + Intent-Bound Purchase Agent (Kit 2) on Airwallex sandbox. Airwallex Agentic Banking Hackathon entry."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
